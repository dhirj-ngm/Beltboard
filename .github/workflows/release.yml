# Builds the Windows installer on a real Windows machine and attaches it to a
# DRAFT GitHub release. Drafts are invisible to the public until published, so a
# build never reaches the client by accident.
#
# Ship a version:
#   1. bump "version" in package.json and commit
#   2. git tag v<version> && git push --tags
#   3. check the draft:   gh release view v<version>
#   4. publish it:        gh release edit v<version> --draft=false
#
# Built here rather than locally because the NSIS installer step needs Windows
# (or Wine), and building on Windows also gives the .exe its proper metadata.

name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test the board rules
        run: npm test

      # The draft must exist before electron-builder publishes. Otherwise it
      # uploads the installer and its blockmap in parallel, each finds no release,
      # each creates one — and the installer ends up on a duplicate draft while the
      # release you look at holds only the blockmap. That happened on v0.1.0.
      - name: Make sure the draft release exists
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --draft --title "Belt Board $VERSION" --notes "Windows installer for Belt Board $VERSION."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and attach it to the draft release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep a copy on the workflow run too
        uses: actions/upload-artifact@v4
        with:
          name: BeltBoard-Setup
          path: dist/*.exe
